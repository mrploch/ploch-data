name: Release

on:
  workflow_dispatch:
    inputs:
      release_version:
        description: 'Version to release (e.g. 3.0, 2.1). The patch version is computed automatically by NBGV.'
        required: true
        type: string
      next_version:
        description: 'Next development version after release (e.g. 3.1). Leave empty to auto-increment the minor version.'
        required: false
        type: string

permissions:
  contents: write
  packages: write

jobs:
  release:
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    # Pass workflow inputs via env vars to avoid script injection (githubactions:S7635)
    env:
      RELEASE_VERSION: ${{ inputs.release_version }}
      NEXT_VERSION_INPUT: ${{ inputs.next_version }}

    steps:
      - name: Validate inputs
        run: |
          if [[ ! "$RELEASE_VERSION" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "::error::release_version must be in major.minor format (e.g. 3.0) without leading zeros"
            exit 1
          fi
          if [ -n "$NEXT_VERSION_INPUT" ]; then
            if [[ ! "$NEXT_VERSION_INPUT" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
              echo "::error::next_version must be in major.minor format (e.g. 3.1) without leading zeros"
              exit 1
            fi
          fi

      # Validate GH_TOKEN early — it is needed later for pushing commits and tags.
      # The default GITHUB_TOKEN cannot trigger subsequent workflows, so a PAT is required.
      - name: Validate GH_TOKEN secret
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "::error::GH_TOKEN secret is not set. A Personal Access Token with 'repo' and 'workflow' scopes is required."
            exit 1
          fi
          # Verify the token is valid by calling the GitHub API
          HTTP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
            -H "Authorization: token $GH_TOKEN" \
            https://api.github.com/repos/${{ github.repository }})
          if [ "$HTTP_STATUS" != "200" ]; then
            echo "::error::GH_TOKEN is invalid or expired (HTTP $HTTP_STATUS). Please regenerate the PAT and update the repository secret."
            exit 1
          fi
          echo "GH_TOKEN is valid"

      # Use the default GITHUB_TOKEN for checkout — it always works and has read access.
      # GH_TOKEN (PAT) is configured separately, inside each push step, because it is the
      # only token that can trigger subsequent workflows when pushing commits.
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          # Do not leave the job token in .git/config where every later step in this job
          # could read it (issue #128). Nothing between here and the push steps needs
          # credentials: the sibling repositories are cloned over plain public HTTPS, and
          # each push configures - and immediately removes - the PAT for itself.
          persist-credentials: false

      - name: Clone mrploch-development (shared build config)
        run: git clone --depth 1 https://github.com/mrploch/mrploch-development.git ../mrploch-development

      - name: Clone ploch-common (project references)
        run: git clone https://github.com/mrploch/ploch-common.git ../ploch-common

      - name: Start SqlServer
        run: docker run --name sqlserver -e 'ACCEPT_EULA=Y' -e 'MSSQL_SA_PASSWORD=P@ssw0rd' -p 1401:1433 -d mcr.microsoft.com/mssql/server

      - name: Wait for SQL Server container
        uses: jakejarvis/wait-action@919fc193e07906705e5b7a50f90ea9e74d20b2b0 # v0.1.1
        with:
          time: '5s'

      # Install every SDK generation the solution targets. These must stay in
      # step with <TargetFrameworkVersions> in Directory.Build.props and with
      # the identical step in build-dotnet.yml: a .NET 9 SDK cannot build a
      # net10.0 target, and this workflow is workflow_dispatch-only, so pull
      # request CI never exercises it.
      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: |
            8.0.x
            10.0.x

      - name: Install mono
        run: |
          sudo apt install -y ca-certificates gnupg curl
          KEYRING=/usr/share/keyrings/mono-official-archive-keyring.gpg
          KEY_FINGERPRINT=3FA7E0328081BFF6A14DA29AA6A19B38D3D831EF
          IMPORTED=0
          # Primary: download the key directly from the mono project's HTTPS
          # endpoint. This avoids GPG keyservers entirely, which have been
          # unreliable (keyserver.ubuntu.com / pgp.mit.edu unresponsive,
          # keys.openpgp.org strips UIDs).
          if curl -fsSL --max-time 30 https://download.mono-project.com/repo/xamarin.gpg -o /tmp/mono.gpg.raw; then
            # The file may be either ASCII-armored or binary; --dearmor
            # handles the armored case, and a binary keyring can be copied
            # as-is. Try dearmor first; if it fails, treat the file as binary.
            if sudo gpg --dearmor < /tmp/mono.gpg.raw > /tmp/mono.gpg.bin 2>/dev/null && [ -s /tmp/mono.gpg.bin ]; then
              sudo cp /tmp/mono.gpg.bin "$KEYRING"
            else
              sudo cp /tmp/mono.gpg.raw "$KEYRING"
            fi
            sudo chmod 644 "$KEYRING"
            if sudo gpg --homedir /tmp --no-default-keyring --keyring "$KEYRING" --list-keys "$KEY_FINGERPRINT" 2>/dev/null | grep -q '^uid'; then
              echo "Imported mono signing key directly from download.mono-project.com"
              IMPORTED=1
            fi
          fi
          # Fallback: keyserver loop (each capped at 30s so an unresponsive
          # server cannot hang the build).
          if [ "$IMPORTED" -ne 1 ]; then
            echo "Direct download failed or yielded no usable key; falling back to keyservers..."
            sudo rm -f "$KEYRING"
            for ks in hkp://keyserver.ubuntu.com:80 hkp://pgp.mit.edu; do
              sudo timeout 30 gpg --homedir /tmp --no-default-keyring --keyring "$KEYRING" --keyserver "$ks" --recv-keys "$KEY_FINGERPRINT" || true
              if sudo gpg --homedir /tmp --no-default-keyring --keyring "$KEYRING" --list-keys "$KEY_FINGERPRINT" 2>/dev/null | grep -q '^uid'; then
                echo "Imported mono signing key (with UID) from $ks"
                IMPORTED=1
                break
              fi
              echo "Keyserver $ks did not yield a usable key, trying next..."
            done
          fi
          if [ "$IMPORTED" -ne 1 ]; then
            echo "::error::Failed to import mono signing key from any source"
            exit 1
          fi
          echo "deb [signed-by=$KEYRING] https://download.mono-project.com/repo/ubuntu stable-focal main" | sudo tee /etc/apt/sources.list.d/mono-official-stable.list
          sudo apt update
          sudo apt install -y mono-devel

      - name: Install NBGV tool
        run: dotnet tool restore

      - name: Add GitHub Packages Source
        env:
          GH_PACKAGES_TOKEN: ${{ secrets.GH_PACKAGES_TOKEN }}
        run: dotnet nuget list source --format short | grep -q github || dotnet nuget add source --username kploch --password "$GH_PACKAGES_TOKEN" --store-password-in-clear-text --name github "https://nuget.pkg.github.com/mrploch/index.json"

      # Identity only. The PAT is deliberately NOT written into the remote URL here
      # (issue #128): doing so left the credential in .git/config for the remainder of the
      # job, readable by every later step including third-party actions. Each push step
      # below now installs the PAT immediately before its push and removes it straight
      # afterwards via a trap, so the credential's lifetime is a single git command.
      - name: Configure git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Set release version
        run: |
          dotnet nbgv set-version "$RELEASE_VERSION"
          echo "Release version set to $RELEASE_VERSION"

      # Use the current HEAD commit timestamp so reruns recreate the same
      # release commit SHA until the release branch state changes.
      - name: Commit release version
        run: |
          RELEASE_COMMIT_TIMESTAMP=$(git show -s --format=%cI HEAD)
          export GIT_AUTHOR_DATE="$RELEASE_COMMIT_TIMESTAMP"
          export GIT_COMMITTER_DATE="$RELEASE_COMMIT_TIMESTAMP"
          git add version.json
          git diff --cached --quiet && echo "version.json unchanged, skipping commit" || \
            git commit -m "chore(release): Set version to $RELEASE_VERSION"

      - name: Get computed NuGet version
        id: version
        run: |
          NUGET_VERSION=$(dotnet nbgv get-version --variable NuGetPackageVersion)
          echo "nuget_version=$NUGET_VERSION" >> $GITHUB_OUTPUT
          echo "NuGet package version: $NUGET_VERSION"

      - name: Restore dependencies
        run: dotnet restore ./Ploch.Data.slnx

      - name: Build (Release)
        run: dotnet build ./Ploch.Data.slnx --no-restore -c Release

      - name: Test
        run: dotnet test ./Ploch.Data.slnx --no-build -c Release --verbosity normal --logger "trx;LogFileName=TestOutputResults.trx" /p:CollectCoverage=true /p:CoverletOutput=./CoverageResults/ "/p:CoverletOutputFormat=cobertura%2copencover"

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-test-results
          path: |
            **/TestResults/*.xml
            **/TestResults/*.trx

      # Tag is created BEFORE publishing packages intentionally.
      # Rationale: orphaned packages on NuGet.org cannot be deleted (only unlisted),
      # while tags can be deleted and re-created easily. Tag-first is the safer default.
      # Retry-safe: re-uses existing tag if it already points at HEAD.
      - name: Create and push tag
        id: tag
        if: success()
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
          REPO_URL: https://github.com/${{ github.repository }}.git
        run: |
          # Scrub any credentialed remote URL on every exit path, including a failed push,
          # so the PAT never outlives this step (issue #128).
          trap 'git remote set-url origin "$REPO_URL"' EXIT
          NUGET_VERSION="${{ steps.version.outputs.nuget_version }}"
          TAG="v${NUGET_VERSION}"
          if git rev-parse "$TAG" >/dev/null 2>&1; then
            echo "Tag $TAG already exists, verifying it points to HEAD"
            EXISTING=$(git rev-parse "$TAG^{}")
            CURRENT=$(git rev-parse HEAD)
            if [ "$EXISTING" != "$CURRENT" ]; then
              echo "::error::Tag $TAG exists but points to a different commit. Delete it manually to retry."
              exit 1
            fi
            echo "Tag $TAG already points to HEAD, reusing it"
          else
            git tag -a "$TAG" -m "Release ${NUGET_VERSION}"
            git remote set-url origin "https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git"
            git push origin "$TAG"
            git remote set-url origin "$REPO_URL"
          fi
          echo "tag=$TAG" >> $GITHUB_OUTPUT

      - name: Publish NuGet packages to NuGet.org
        if: success()
        env:
          NUGET_API_KEY: ${{ secrets.NUGET_API_KEY }}
        run: |
          PKGS=$(find . -name '*.nupkg' -not -path '*/test*' -not -path '*/Test*')
          if [ -z "$PKGS" ]; then
            echo "::error::No .nupkg files were produced by the build."
            exit 1
          fi
          echo "$PKGS" | while read pkg; do
            echo "Publishing $pkg"
            dotnet nuget push "$pkg" --source https://api.nuget.org/v3/index.json --skip-duplicate -k "$NUGET_API_KEY"
          done

      - name: Publish symbol packages to NuGet.org
        if: success()
        env:
          NUGET_API_KEY: ${{ secrets.NUGET_API_KEY }}
        run: |
          find . -name '*.snupkg' -not -path '*/test*' -not -path '*/Test*' | while read pkg; do
            echo "Publishing symbols $pkg"
            dotnet nuget push "$pkg" --source https://api.nuget.org/v3/index.json --skip-duplicate -k "$NUGET_API_KEY"
          done

      # Generate release notes BEFORE archiving change-log entries,
      # so only the current release's entries are included.
      - name: Generate release notes
        id: release-notes
        if: success()
        env:
          NUGET_VERSION: ${{ steps.version.outputs.nuget_version }}
        run: |
          NOTES=""
          if [ -d "change-log" ] && [ "$(ls -A change-log/*.md 2>/dev/null)" ]; then
            NOTES=$(cat change-log/*.md)
          fi
          if [ -z "$NOTES" ]; then
            NOTES="Release ${NUGET_VERSION}"
          fi
          cat > /tmp/release-notes.md <<ENDOFNOTES
          $NOTES

          ---

          ## NuGet Packages

          All packages are available on [NuGet.org](https://www.nuget.org/profiles/mrploch) with version \`${NUGET_VERSION}\`.

          Install via:
          \`\`\`bash
          dotnet add package Ploch.Data.GenericRepository.EFCore --version ${NUGET_VERSION}
          \`\`\`
          ENDOFNOTES

      - name: Create GitHub Release
        if: success()
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          name: "Release ${{ steps.version.outputs.nuget_version }}"
          body_path: /tmp/release-notes.md
          draft: false
          prerelease: false

      # softprops/action-gh-release 2.5.0 and later no longer create a release atomically:
      # createRelease always creates a DRAFT when `prerelease: false`, regardless of our
      # explicit `draft: false`, and a second call (finalizeRelease) publishes it. If the
      # run dies between the two, or finalizeRelease exhausts its three internal retries,
      # the release is left unpublished - and the NuGet packages went public several steps
      # earlier and cannot be withdrawn. Assert the end state so a stranded draft fails the
      # workflow loudly instead of going unnoticed. Re-running the workflow recovers: the
      # action finds the existing draft and publishes it. See issue #137.
      - name: Verify the GitHub release is published
        # Deliberately NOT success(): the stranded draft is created by a run in which the
        # release action itself FAILS after createRelease but before finalizeRelease, and
        # success() would skip this step in precisely that case. It runs whenever a tag was
        # produced and the run was not cancelled, so it reports the end state either way.
        if: ${{ !cancelled() && steps.tag.outputs.tag != '' }}
        env:
          # The built-in job token suffices - the workflow already grants `contents: write`
          # - and using it here avoids handing the long-lived PAT to another step.
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.tag.outputs.tag }}
          REPO: ${{ github.repository }}
        run: |
          # A missing release is a distinct outcome from a draft one, and only the second
          # is recoverable by re-running: report them separately rather than letting an
          # empty lookup masquerade as a draft.
          if ! IS_DRAFT=$(gh release view "$TAG" --repo "$REPO" --json isDraft --jq '.isDraft' 2>/dev/null); then
            echo "::error title=No release found::No GitHub release exists for tag $TAG. If the NuGet packages for this version were already published, create the release manually or re-run this workflow."
            exit 1
          fi
          if [ "$IS_DRAFT" != "false" ]; then
            echo "::error title=Release left as a draft::Release $TAG exists but is still a draft (isDraft=$IS_DRAFT). The NuGet packages for this version are already public. Re-run this workflow to publish the draft, or publish it manually from the Releases page."
            exit 1
          fi
          echo "Release $TAG is published (isDraft=false)."

      - name: Compute next development version
        id: next
        if: success()
        run: |
          NEXT="$NEXT_VERSION_INPUT"
          if [ -z "$NEXT" ]; then
            MAJOR=$(echo "$RELEASE_VERSION" | cut -d. -f1)
            MINOR=$(echo "$RELEASE_VERSION" | cut -d. -f2)
            NEXT="$MAJOR.$((MINOR + 1))"
          fi
          echo "next_version=$NEXT" >> $GITHUB_OUTPUT
          echo "Next development version: $NEXT-prerelease"

      - name: Set next development version
        if: success()
        env:
          NEXT_DEV_VERSION: ${{ steps.next.outputs.next_version }}
        run: |
          dotnet nbgv set-version "${NEXT_DEV_VERSION}-prerelease"

      - name: Update SampleApp to released stable version
        if: success()
        env:
          NUGET_VERSION: ${{ steps.version.outputs.nuget_version }}
        run: |
          PROPS_FILE="samples/SampleApp/Directory.Packages.props"
          # Replace the floating wildcard (or any previous version) with the stable release version
          sed -i "s|<PlochDataPackagesVersion>.*</PlochDataPackagesVersion>|<PlochDataPackagesVersion>${NUGET_VERSION}</PlochDataPackagesVersion>|" "$PROPS_FILE"
          echo "Updated SampleApp PlochDataPackagesVersion to ${NUGET_VERSION}"

      - name: Archive consumed change-log entries
        if: success()
        run: |
          if [ -d "change-log" ] && [ "$(ls -A change-log/*.md 2>/dev/null)" ]; then
            mkdir -p change-log/archive
            mv change-log/*.md change-log/archive/ 2>/dev/null || true
          fi

      # Idempotent commit: only commit if there are staged changes.
      # Push may fail if branch protection requires PRs — this is non-fatal.
      # If push fails, a warning is emitted and the version bump must be done manually via PR.
      - name: Commit and push next development version
        id: version-bump
        if: success()
        env:
          NEXT_DEV_VERSION: ${{ steps.next.outputs.next_version }}
          NUGET_VERSION: ${{ steps.version.outputs.nuget_version }}
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
          REPO_URL: https://github.com/${{ github.repository }}.git
        run: |
          # As above: scrub the credentialed remote on every exit path (issue #128).
          trap 'git remote set-url origin "$REPO_URL"' EXIT
          git add version.json
          git add change-log/ || true
          git add samples/SampleApp/Directory.Packages.props || true
          git diff --cached --quiet && echo "No changes to commit" || \
            git commit -m "chore(release): Bump version to ${NEXT_DEV_VERSION}-prerelease for development

          Update SampleApp to reference stable ${NUGET_VERSION} packages."
          git remote set-url origin "https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git"
          if ! git push origin main 2>&1; then
            echo "::warning::Could not push version bump directly to main (branch protection). Create a PR to bump version.json to ${NEXT_DEV_VERSION}-prerelease manually."
            echo "push_failed=true" >> $GITHUB_OUTPUT
          fi
