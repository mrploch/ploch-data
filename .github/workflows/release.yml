name: Release

on:
  workflow_dispatch:
    inputs:
      release_version:
        description: 'Version to release (e.g. 3.0, 2.1). The patch version is computed automatically by NBGV.'
        required: true
        type: string
      next_version:
        description: 'Next development version after release (e.g. 3.1). Leave empty to auto-increment the minor version.'
        required: false
        type: string

# Serialise runs that release the same version. Two concurrent dispatches would
# otherwise race on the shared chore/post-release-<version> branch and on the tag,
# and a release is never something to run twice at once anyway. cancel-in-progress
# is deliberately false: a run that has already pushed packages to nuget.org must be
# allowed to finish its bookkeeping rather than be killed part-way.
concurrency:
  group: release-${{ inputs.release_version }}
  cancel-in-progress: false

permissions:
  contents: write
  packages: write
  # The post-release bookkeeping is landed as a pull request rather than a direct
  # push, because branch protection on main forbids the latter (#166).
  pull-requests: write
  # Required for NuGet Trusted Publishing: lets the job request a GitHub OIDC
  # token that NuGet/login exchanges for a short-lived nuget.org API key.
  # Without this, NuGet/login fails with 403.
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    # Pass workflow inputs via env vars to avoid script injection (githubactions:S7635)
    env:
      RELEASE_VERSION: ${{ inputs.release_version }}
      NEXT_VERSION_INPUT: ${{ inputs.next_version }}

    steps:
      - name: Validate inputs
        run: |
          if [[ ! "$RELEASE_VERSION" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "::error::release_version must be in major.minor format (e.g. 3.0) without leading zeros"
            exit 1
          fi
          if [ -n "$NEXT_VERSION_INPUT" ]; then
            if [[ ! "$NEXT_VERSION_INPUT" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
              echo "::error::next_version must be in major.minor format (e.g. 3.1) without leading zeros"
              exit 1
            fi
          fi

      # Validate GH_TOKEN early — it is needed later for pushing commits and tags.
      # The default GITHUB_TOKEN cannot trigger subsequent workflows, so a PAT is required.
      - name: Validate GH_TOKEN secret
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "::error::GH_TOKEN secret is not set. A Personal Access Token with 'repo' and 'workflow' scopes is required."
            exit 1
          fi
          # Verify the token is valid by calling the GitHub API
          HTTP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
            -H "Authorization: token $GH_TOKEN" \
            https://api.github.com/repos/${{ github.repository }})
          if [ "$HTTP_STATUS" != "200" ]; then
            echo "::error::GH_TOKEN is invalid or expired (HTTP $HTTP_STATUS). Please regenerate the PAT and update the repository secret."
            exit 1
          fi
          echo "GH_TOKEN is valid"

      # Validated here rather than at push time so a misconfiguration fails in seconds
      # instead of after a full build+test run.
      - name: Validate NuGet Trusted Publishing configuration
        env:
          NUGET_USER: ${{ vars.NUGET_USER }}
        run: |
          if [ -z "$NUGET_USER" ]; then
            echo "::error::Repository/organization variable NUGET_USER is not set. It must contain the nuget.org account name (profile name, NOT the email address) that owns the trusted publishing policy."
            exit 1
          fi
          # Supplying the sign-in email instead of the profile name is the likeliest
          # misconfiguration, and nuget.org rejects it only at token-exchange time.
          case "$NUGET_USER" in
            *@*)
              echo "::error::NUGET_USER looks like an email address. It must be the nuget.org profile name that owns the trusted publishing policy."
              exit 1
              ;;
          esac
          echo "NuGet Trusted Publishing user: $NUGET_USER"

      # Use the default GITHUB_TOKEN for checkout — it always works and has read access.
      # GH_TOKEN (PAT) is configured separately, inside each push step, because it is the
      # only token that can trigger subsequent workflows when pushing commits.
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          # Do not leave the job token in .git/config where every later step in this job
          # could read it (issue #128). Nothing between here and the push steps needs
          # credentials: the sibling repositories are cloned over plain public HTTPS, and
          # each push configures - and immediately removes - the PAT for itself.
          persist-credentials: false

      - name: Clone mrploch-development (shared build config)
        run: git clone --depth 1 https://github.com/mrploch/mrploch-development.git ../mrploch-development

      - name: Clone ploch-common (project references)
        run: git clone https://github.com/mrploch/ploch-common.git ../ploch-common

      # Install every SDK generation the solution targets. These must stay in
      # step with <TargetFrameworkVersions> in Directory.Build.props and with
      # the identical step in build-dotnet.yml: a .NET 9 SDK cannot build a
      # net10.0 target, and this workflow is workflow_dispatch-only, so pull
      # request CI never exercises it.
      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: |
            8.0.x
            10.0.x

      - name: Install mono
        run: |
          sudo apt install -y ca-certificates gnupg curl
          KEYRING=/usr/share/keyrings/mono-official-archive-keyring.gpg
          KEY_FINGERPRINT=3FA7E0328081BFF6A14DA29AA6A19B38D3D831EF
          IMPORTED=0
          # Primary: download the key directly from the mono project's HTTPS
          # endpoint. This avoids GPG keyservers entirely, which have been
          # unreliable (keyserver.ubuntu.com / pgp.mit.edu unresponsive,
          # keys.openpgp.org strips UIDs).
          if curl -fsSL --max-time 30 https://download.mono-project.com/repo/xamarin.gpg -o /tmp/mono.gpg.raw; then
            # The file may be either ASCII-armored or binary; --dearmor
            # handles the armored case, and a binary keyring can be copied
            # as-is. Try dearmor first; if it fails, treat the file as binary.
            if sudo gpg --dearmor < /tmp/mono.gpg.raw > /tmp/mono.gpg.bin 2>/dev/null && [ -s /tmp/mono.gpg.bin ]; then
              sudo cp /tmp/mono.gpg.bin "$KEYRING"
            else
              sudo cp /tmp/mono.gpg.raw "$KEYRING"
            fi
            sudo chmod 644 "$KEYRING"
            if sudo gpg --homedir /tmp --no-default-keyring --keyring "$KEYRING" --list-keys "$KEY_FINGERPRINT" 2>/dev/null | grep -q '^uid'; then
              echo "Imported mono signing key directly from download.mono-project.com"
              IMPORTED=1
            fi
          fi
          # Fallback: keyserver loop (each capped at 30s so an unresponsive
          # server cannot hang the build).
          if [ "$IMPORTED" -ne 1 ]; then
            echo "Direct download failed or yielded no usable key; falling back to keyservers..."
            sudo rm -f "$KEYRING"
            for ks in hkp://keyserver.ubuntu.com:80 hkp://pgp.mit.edu; do
              sudo timeout 30 gpg --homedir /tmp --no-default-keyring --keyring "$KEYRING" --keyserver "$ks" --recv-keys "$KEY_FINGERPRINT" || true
              if sudo gpg --homedir /tmp --no-default-keyring --keyring "$KEYRING" --list-keys "$KEY_FINGERPRINT" 2>/dev/null | grep -q '^uid'; then
                echo "Imported mono signing key (with UID) from $ks"
                IMPORTED=1
                break
              fi
              echo "Keyserver $ks did not yield a usable key, trying next..."
            done
          fi
          if [ "$IMPORTED" -ne 1 ]; then
            echo "::error::Failed to import mono signing key from any source"
            exit 1
          fi
          echo "deb [signed-by=$KEYRING] https://download.mono-project.com/repo/ubuntu stable-focal main" | sudo tee /etc/apt/sources.list.d/mono-official-stable.list
          sudo apt update
          sudo apt install -y mono-devel

      - name: Install NBGV tool
        run: dotnet tool restore

      - name: Add GitHub Packages Source
        env:
          GH_PACKAGES_TOKEN: ${{ secrets.GH_PACKAGES_TOKEN }}
        run: dotnet nuget list source --format short | grep -q github || dotnet nuget add source --username kploch --password "$GH_PACKAGES_TOKEN" --store-password-in-clear-text --name github "https://nuget.pkg.github.com/mrploch/index.json"

      # Identity only. The PAT is deliberately NOT written into the remote URL here
      # (issue #128): doing so left the credential in .git/config for the remainder of the
      # job, readable by every later step including third-party actions. Each push step
      # below now installs the PAT immediately before its push and removes it straight
      # afterwards via a trap, so the credential's lifetime is a single git command.
      - name: Configure git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Set release version
        run: |
          dotnet nbgv set-version "$RELEASE_VERSION"
          echo "Release version set to $RELEASE_VERSION"

      # Use the current HEAD commit timestamp so reruns recreate the same
      # release commit SHA until the release branch state changes.
      - name: Commit release version
        run: |
          RELEASE_COMMIT_TIMESTAMP=$(git show -s --format=%cI HEAD)
          export GIT_AUTHOR_DATE="$RELEASE_COMMIT_TIMESTAMP"
          export GIT_COMMITTER_DATE="$RELEASE_COMMIT_TIMESTAMP"
          git add version.json
          git diff --cached --quiet && echo "version.json unchanged, skipping commit" || \
            git commit -m "chore(release): Set version to $RELEASE_VERSION"

      - name: Get computed NuGet version
        id: version
        run: |
          NUGET_VERSION=$(dotnet nbgv get-version --variable NuGetPackageVersion)
          echo "nuget_version=$NUGET_VERSION" >> $GITHUB_OUTPUT
          echo "NuGet package version: $NUGET_VERSION"

      - name: Restore dependencies
        run: dotnet restore ./Ploch.Data.slnx

      - name: Build (Release)
        run: dotnet build ./Ploch.Data.slnx --no-restore -c Release

      - name: Test
        run: dotnet test ./Ploch.Data.slnx --no-build -c Release --verbosity normal --logger "trx;LogFileName=TestOutputResults.trx" /p:CollectCoverage=true /p:CoverletOutput=./CoverageResults/ "/p:CoverletOutputFormat=cobertura%2copencover"

      # Pack separately from the build above, with -p:UseProjectReferences=false.
      #
      # Build and test must use ProjectReferences: the Ploch.TestingSupport.XUnit3.* projects are not
      # published as packages, so the test projects always reference the sibling ploch-common checkout
      # by project. Mixing that with a Ploch.Common PackageReference is what broke `dotnet test -c
      # Release` in issue #95, which is why UseProjectReferences now defaults to true.
      #
      # Packages must NOT be produced that way. A ProjectReference-resolved pack writes the sibling
      # checkout's version (currently 4.0.x-prerelease) into the nuspec, and no Ploch.Common 4.x exists
      # on nuget.org - the published packages would be unrestorable. Packing with
      # -p:UseProjectReferences=false restores the central package versions from Directory.Packages.props
      # instead. Pinning the ploch-common clone to a released tag is tracked in issue #67.
      - name: Pack (package-resolved dependencies)
        run: dotnet pack ./Ploch.Data.slnx -c Release -p:UseProjectReferences=false -o ./artifacts/packages

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-test-results
          path: |
            **/TestResults/*.xml
            **/TestResults/*.trx

      # Tag is created BEFORE publishing packages intentionally.
      # Rationale: orphaned packages on NuGet.org cannot be deleted (only unlisted),
      # while tags can be deleted and re-created easily. Tag-first is the safer default.
      # Retry-safe: re-uses existing tag if it already points at HEAD.
      - name: Create and push tag
        id: tag
        if: success()
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
          REPO_URL: https://github.com/${{ github.repository }}.git
          NUGET_VERSION: ${{ steps.version.outputs.nuget_version }}
        run: |
          # Scrub any credentialed remote URL on every exit path, including a failed push,
          # so the PAT never outlives this step (issue #128).
          trap 'git remote set-url origin "$REPO_URL"' EXIT
          TAG="v${NUGET_VERSION}"
          if git rev-parse "$TAG" >/dev/null 2>&1; then
            echo "Tag $TAG already exists, verifying it points to HEAD"
            EXISTING=$(git rev-parse "$TAG^{}")
            CURRENT=$(git rev-parse HEAD)
            if [ "$EXISTING" != "$CURRENT" ]; then
              echo "::error::Tag $TAG exists but points to a different commit. Delete it manually to retry."
              exit 1
            fi
            echo "Tag $TAG already points to HEAD, reusing it"
          else
            git tag -a "$TAG" -m "Release ${NUGET_VERSION}"
            git remote set-url origin "https://x-access-token:${GH_TOKEN}@${REPO_URL#https://}"
            git push origin "$TAG"
            git remote set-url origin "$REPO_URL"
          fi
          echo "tag=$TAG" >> $GITHUB_OUTPUT

      # Exchange the GitHub OIDC token for a short-lived nuget.org API key.
      #
      # Placed immediately before the push steps on purpose: the issued key is valid for
      # only one hour, so requesting it before a full build and test run risks expiry on a
      # slow release.
      #
      # The trusted publishing policy on nuget.org is bound to (owner, repo, workflow
      # FILENAME). It matches `release.yml` — renaming this file breaks publishing.
      - name: Authenticate to NuGet.org via Trusted Publishing (OIDC)
        id: nuget-login
        if: success()
        # Pinned to a full commit SHA: the action runs at the publishing boundary with
        # id-token: write, and the floating v1 tag is mutable (githubactions:S7637).
        uses: NuGet/login@8d196754b4036150537f80ac539e15c2f1028841 # v1.2.0
        with:
          user: ${{ vars.NUGET_USER }}

      - name: Publish NuGet packages to NuGet.org
        if: success()
        env:
          NUGET_API_KEY: ${{ steps.nuget-login.outputs.NUGET_API_KEY }}
        run: |
          # Only the artifacts directory: it holds the packages from the dedicated pack step, whose
          # dependencies were resolved from packages rather than from the sibling ploch-common checkout.
          # The bin/ directories also contain nupkgs from the Release build, and those carry the wrong
          # dependency versions - they must never be published.
          #
          # The Ploch.Data.* filter is load-bearing: the test projects reference the unpublished
          # Ploch.TestingSupport.XUnit3.* projects, so packing the solution also packs the ploch-common
          # projects behind them (Ploch.Common, Ploch.Common.AppServices, ...). Those belong to another
          # repository and must never be published from here.
          PKGS=$(find ./artifacts/packages -name 'Ploch.Data.*.nupkg')
          if [ -z "$PKGS" ]; then
            echo "::error::No .nupkg files were produced by the pack step."
            exit 1
          fi
          echo "$PKGS" | while read pkg; do
            echo "Publishing $pkg"
            dotnet nuget push "$pkg" --source https://api.nuget.org/v3/index.json --skip-duplicate -k "$NUGET_API_KEY"
          done

      - name: Publish symbol packages to NuGet.org
        if: success()
        env:
          NUGET_API_KEY: ${{ steps.nuget-login.outputs.NUGET_API_KEY }}
        run: |
          find ./artifacts/packages -name 'Ploch.Data.*.snupkg' | while read pkg; do
            echo "Publishing symbols $pkg"
            dotnet nuget push "$pkg" --source https://api.nuget.org/v3/index.json --skip-duplicate -k "$NUGET_API_KEY"
          done

      # Generate release notes BEFORE archiving change-log entries,
      # so only the current release's entries are included.
      - name: Generate release notes
        id: release-notes
        if: success()
        env:
          NUGET_VERSION: ${{ steps.version.outputs.nuget_version }}
        run: |
          NOTES=""
          if [ -d "change-log" ] && [ "$(ls -A change-log/*.md 2>/dev/null)" ]; then
            NOTES=$(cat change-log/*.md)
          fi
          if [ -z "$NOTES" ]; then
            NOTES="Release ${NUGET_VERSION}"
          fi
          cat > /tmp/release-notes.md <<ENDOFNOTES
          $NOTES

          ---

          ## NuGet Packages

          All packages are available on [NuGet.org](https://www.nuget.org/profiles/mrploch) with version \`${NUGET_VERSION}\`.

          Install via:
          \`\`\`bash
          dotnet add package Ploch.Data.GenericRepository.EFCore --version ${NUGET_VERSION}
          \`\`\`
          ENDOFNOTES

      - name: Create GitHub Release
        id: release
        if: success()
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          name: "Release ${{ steps.version.outputs.nuget_version }}"
          body_path: /tmp/release-notes.md
          draft: false
          prerelease: false

      # softprops/action-gh-release 2.5.0 and later no longer create a release atomically:
      # createRelease always creates a DRAFT when `prerelease: false`, regardless of our
      # explicit `draft: false`, and a second call (finalizeRelease) publishes it. If the
      # run dies between the two, or finalizeRelease exhausts its three internal retries,
      # the release is left unpublished - and the NuGet packages went public several steps
      # earlier and cannot be withdrawn. Assert the end state so a stranded draft fails the
      # workflow loudly instead of going unnoticed. Re-running the workflow recovers: the
      # action finds the existing draft and publishes it. See issue #137.
      - name: Verify the GitHub release is published
        # Deliberately NOT success(): the stranded draft is created by a run in which the
        # release action itself FAILS after createRelease but before finalizeRelease, and
        # success() would skip this step in precisely that case.
        #
        # always(), not !cancelled(): a run CANCELLED mid-release - the operator hits Cancel,
        # or the 6-hour job limit trips - is exactly "the run died between the two calls",
        # and that is when a stranded draft most needs reporting. This is a safety assertion
        # after an irreversible NuGet push, not a cosmetic warning, so the cancellation noise
        # is worth paying for.
        #
        # `steps.release.outcome != 'skipped'` suppresses a false alarm: four steps between
        # the tag and the release are gated on success(), so if the package push fails they
        # all skip, the release action never runs, and an unguarded condition here would
        # print "No release found ... the packages may already be published" - precisely
        # backwards - on top of the genuine failure.
        if: ${{ always() && steps.tag.outputs.tag != '' && steps.release.outcome != 'skipped' }}
        env:
          # The built-in job token suffices - the workflow already grants `contents: write`
          # - and using it here avoids handing the long-lived PAT to another step.
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.tag.outputs.tag }}
          REPO: ${{ github.repository }}
        run: |
          # A missing release is a distinct outcome from a draft one, and only the second
          # is recoverable by re-running: report them separately rather than letting an
          # empty lookup masquerade as a draft.
          # Keep stderr: an auth failure, a rate limit or a network blip is a different
          # diagnosis from "the release does not exist", and discarding the message would
          # collapse all three into the same misleading error at the most expensive possible
          # moment - immediately after an irreversible NuGet push.
          if ! IS_DRAFT=$(gh release view "$TAG" --repo "$REPO" --json isDraft --jq '.isDraft' 2>"$RUNNER_TEMP/gh-release-view.err"); then
            LOOKUP_ERROR=$(cat "$RUNNER_TEMP/gh-release-view.err")
            # `gh release view` finds drafts only through a fallback listing path, so query
            # the API directly before concluding that no release exists at all.
            DRAFT_FLAG=$(gh api "repos/$REPO/releases" --paginate --jq ".[] | select(.tag_name==\"$TAG\") | .draft" || true)
            if [ "$DRAFT_FLAG" = "true" ]; then
              echo "::error title=Release left as a draft::Release $TAG exists but is still a draft. The NuGet packages for this version are already public. Re-run this workflow to publish the draft, or publish it manually from the Releases page."
              exit 1
            fi
            echo "::error title=Release lookup failed::Could not read the GitHub release for tag $TAG. gh reported: ${LOOKUP_ERROR:-<no output>}. If the NuGet packages for this version were already published, verify the release manually or re-run this workflow."
            exit 1
          fi
          if [ "$IS_DRAFT" != "false" ]; then
            echo "::error title=Release left as a draft::Release $TAG exists but is still a draft (isDraft=$IS_DRAFT). The NuGet packages for this version are already public. Re-run this workflow to publish the draft, or publish it manually from the Releases page."
            exit 1
          fi
          echo "Release $TAG is published (isDraft=false)."

      - name: Compute next development version
        id: next
        if: success()
        run: |
          NEXT="$NEXT_VERSION_INPUT"
          if [ -z "$NEXT" ]; then
            MAJOR=$(echo "$RELEASE_VERSION" | cut -d. -f1)
            MINOR=$(echo "$RELEASE_VERSION" | cut -d. -f2)
            NEXT="$MAJOR.$((MINOR + 1))"
          fi
          echo "next_version=$NEXT" >> $GITHUB_OUTPUT
          echo "Next development version: $NEXT-prerelease"

      - name: Set next development version
        if: success()
        env:
          NEXT_DEV_VERSION: ${{ steps.next.outputs.next_version }}
        run: |
          dotnet nbgv set-version "${NEXT_DEV_VERSION}-prerelease"

      - name: Update SampleApp to released stable version
        if: success()
        env:
          NUGET_VERSION: ${{ steps.version.outputs.nuget_version }}
        run: |
          PROPS_FILE="samples/SampleApp/Directory.Packages.props"
          # Replace the floating wildcard (or any previous version) with the stable release version
          sed -i "s|<PlochDataPackagesVersion>.*</PlochDataPackagesVersion>|<PlochDataPackagesVersion>${NUGET_VERSION}</PlochDataPackagesVersion>|" "$PROPS_FILE"
          echo "Updated SampleApp PlochDataPackagesVersion to ${NUGET_VERSION}"

      - name: Archive consumed change-log entries
        if: success()
        run: |
          if [ -d "change-log" ] && [ "$(ls -A change-log/*.md 2>/dev/null)" ]; then
            mkdir -p change-log/archive
            mv change-log/*.md change-log/archive/ 2>/dev/null || true
          fi

      # The bookkeeping lands via a PULL REQUEST, not a direct push.
      #
      # WHY (#166): branch protection on main rejects a direct push with
      #   remote: - Required status check "SonarCloud Code Analysis" is expected.
      #   ! [remote rejected] main -> main (protected branch hook declined)
      # `enforce_admins: false` does NOT cover the pull-request requirement - that is
      # governed separately by `bypass_pull_request_allowances`, which is unset on this
      # branch, so *nobody* may push directly, admin token or not. This sank the final
      # step of the release run on 2026-03-14 (run 23076934823).
      #
      # The previous version of this step downgraded that rejection to a ::warning:: and
      # carried on, so the run went GREEN while the bookkeeping silently did not land -
      # leaving version.json claiming the released version and the change-log entries
      # unarchived, which would duplicate every one of them into the next release's
      # generated notes. A green run that did half its job is worse than a red one.
      #
      # Opening a pull request needs no elevated permission and cannot be refused by
      # branch protection, so the release finishes green and the bookkeeping waits for a
      # normal review.
      - name: Open a pull request with the next development version
        if: success()
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
          NEXT_DEV_VERSION: ${{ steps.next.outputs.next_version }}
          RELEASED_VERSION: ${{ steps.version.outputs.nuget_version }}
        run: |
          set -euo pipefail

          git add version.json
          git add change-log/ || true
          git add samples/SampleApp/Directory.Packages.props || true

          if git diff --cached --quiet; then
            echo "No bookkeeping changes to land; nothing to open a pull request for."
            echo "No post-release bookkeeping was required." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          git commit -m "chore(release): Bump version to ${NEXT_DEV_VERSION}-prerelease for development" \
                     -m "Post-release bookkeeping for ${RELEASED_VERSION}, applied via pull request because branch protection forbids a direct push (#166). Also points the SampleApp at the stable ${RELEASED_VERSION} packages." \
                     -m "Refs: #166"

          # One branch per released version, so re-running the same release updates the
          # same pull request instead of accumulating them.
          #
          # The head ref is UPDATED IN PLACE, never deleted and recreated. GitHub closes a
          # pull request automatically when its head ref is deleted, so a delete would shut
          # the very PR this step is meant to refresh - and the `gh pr list --state open`
          # lookup below would then miss it and open a duplicate, losing the original
          # review and check history.
          #
          # --force-with-lease rather than --force: the push is rejected if the remote
          # branch moved since it was fetched, so a concurrent run cannot be silently
          # overwritten. The branch holds only generated bookkeeping and is owned
          # exclusively by this workflow, so a rewrite here discards nobody's work.
          BRANCH="chore/post-release-${RELEASED_VERSION}"
          git fetch origin "refs/heads/${BRANCH}:refs/remotes/origin/${BRANCH}" 2>/dev/null || true
          git push --force-with-lease origin "HEAD:refs/heads/${BRANCH}"

          EXISTING=$(gh pr list --head "$BRANCH" --state open --json number --jq '.[0].number // empty')
          if [ -n "$EXISTING" ]; then
            PR_URL=$(gh pr view "$EXISTING" --json url --jq .url)
            echo "Pull request #${EXISTING} was already open for ${BRANCH}; it now carries the update."
          else
            BODY=$(printf '%s\n' \
              "Post-release bookkeeping for **${RELEASED_VERSION}**, opened automatically by the release workflow." \
              "" \
              "- \`version.json\` bumped to \`${NEXT_DEV_VERSION}-prerelease\`" \
              "- Consumed \`change-log/*.md\` entries moved into \`change-log/archive/\`, so they are not duplicated into the next release's generated notes" \
              "- \`samples/SampleApp/Directory.Packages.props\` pointed at the stable \`${RELEASED_VERSION}\` packages" \
              "" \
              "This arrives as a pull request rather than a direct push because branch protection requires one - see #166." \
              "" \
              "Refs: #166")
            PR_URL=$(gh pr create \
              --base "${GITHUB_REF_NAME}" \
              --head "$BRANCH" \
              --title "chore(release): Bump version to ${NEXT_DEV_VERSION}-prerelease after ${RELEASED_VERSION}" \
              --body "$BODY")
            echo "Opened ${PR_URL}"
          fi

          {
            echo "### Post-release bookkeeping"
            echo
            echo "Released **${RELEASED_VERSION}**; next development version **${NEXT_DEV_VERSION}-prerelease**."
            echo
            echo "Bookkeeping pull request: ${PR_URL}"
            echo
            echo "Merge it to bring \`${GITHUB_REF_NAME}\` in line with the published release."
          } >> "$GITHUB_STEP_SUMMARY"
