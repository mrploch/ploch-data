name: Qodana
on:
  workflow_dispatch:

jobs:
  qodana:
    timeout-minutes: 15
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      checks: write
      # Required by github/codeql-action/upload-sarif below. Declaring an explicit permissions
      # block drops every scope not listed to none, so without this the SARIF upload fails with
      # 403 and the Qodana results never reach code scanning.
      security-events: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
      - name: 'Qodana Scan'
        uses: JetBrains/qodana-action@491da5246a31d74fe3fe86db365d16e4d4edfb91 # v2025.1.0
        with:
          args: --baseline,./qodana.sarif.json
        env:
          # The secret is named QODANA_TOKEN_1681345019 in this repository; there is no secret
          # called QODANA_TOKEN at either repository or organisation level, so the previous
          # reference expanded to an empty string and the scan ran unauthenticated. The
          # environment variable must keep its name — that is what the action reads.
          QODANA_TOKEN: ${{ secrets.QODANA_TOKEN_1681345019 }}
      - uses: github/codeql-action/upload-sarif@db488ddef3bf6cb639b32c2e9a7c0a7ea8271d28 # v4.37.8
        with:
          sarif_file: ${{ runner.temp }}/qodana/results/qodana.sarif.json