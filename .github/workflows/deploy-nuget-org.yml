# Legacy manual release pipeline: build, test, analyse and publish packages to NuGet.org.
# Kept aligned with build-dotnet.yml (SonarCloud /d: arguments, solution file, SDK versions).

name: Build, test and deploy to nuget.org
on:
  workflow_dispatch:

# Least privilege (issue #128). Declaring any permissions block drops every scope not
# listed to none, and `contents: read` is all this job needs: it checks out the
# repository, clones the sibling repositories over plain public HTTPS, and publishes to
# nuget.org with an explicit API key. Nothing here pushes to the repository, publishes to
# GitHub Packages (the GitHub Packages source is added for *restore* and authenticates
# with GH_PACKAGES_TOKEN, not GITHUB_TOKEN), or writes a check run.
permissions:
  contents: read

env:
  SONAR_PROJECT_KEY: ${{ vars.SONAR_PROJECT_KEY }}
  SONAR_ORGANIZATION: ${{ vars.SONAR_ORGANIZATION }}
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - run: echo "The branch name is ${{ github.repository }}"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # NBGV needs the full history to compute commit height.
          fetch-depth: 0
          # Do not leave the job token in .git/config, where any later repository-controlled
          # command could read it. Nothing here pushes: the sibling repositories are cloned over
          # plain public HTTPS, and the Pages deploy takes its token as an explicit input.
          persist-credentials: false
      - name: Clone mrploch-development (shared build config)
        run: git clone --depth 1 https://github.com/mrploch/mrploch-development.git ../mrploch-development
      - name: Clone ploch-common (project references)
        run: git clone https://github.com/mrploch/ploch-common.git ../ploch-common

      - uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00 # v4.7.1
        with:
          distribution: 'zulu'
          java-version: '17'
      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: |
            8.0.x
            10.0.x

      - name: Restore .NET tools
        run: dotnet tool restore

      - name: Add GitHub Packages Source
        env:
          GH_PACKAGES_TOKEN: ${{ secrets.GH_PACKAGES_TOKEN }}
        run: dotnet nuget list source --format short | grep -q github || dotnet nuget add source --username kploch --password "$GH_PACKAGES_TOKEN" --store-password-in-clear-text --name github "https://nuget.pkg.github.com/mrploch/index.json"

      - name: Restore dependencies
        run: dotnet restore ./Ploch.Data.slnx

      # Capture the NBGV-computed package version so SonarScanner can pass it
      # as sonar.projectVersion. Release runs are where the version actually
      # changes, so the "Previous version" new-code definition depends on this
      # here even more than in build-dotnet.yml. Mirrors PR #116 (issue #92).
      - name: Get NBGV version for SonarCloud
        id: nbgv-version
        run: |
          NUGET_VERSION=$(dotnet nbgv get-version --variable NuGetPackageVersion)
          echo "nuget_version=$NUGET_VERSION" >> $GITHUB_OUTPUT
          echo "SonarCloud project version: $NUGET_VERSION"

      # SonarCloud setup (non-blocking)
      - name: Install SonarCloud Scanner
        run: dotnet tool install --global dotnet-sonarscanner
        # continue-on-error justified (#82): SonarCloud is deliberately non-blocking here, so a
        # transient NuGet outage installing the tool must not fail the build. A failure is not
        # silent — Begin then fails too, End is skipped by its outcome gate, and the "SonarCloud
        # analysis did not run" step below emits a warning annotation.
        continue-on-error: true
      # Note: analysis settings (coverage paths, exclusions) are passed inline
      # via /d: arguments. The .NET edition of the SonarScanner does not read
      # sonar-project.properties — that file would actively fail post-processing.
      - name: SonarScanner Begin
        id: sonar-begin
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: >
          dotnet sonarscanner begin
          /k:"${{ env.SONAR_PROJECT_KEY }}"
          /o:"${{ env.SONAR_ORGANIZATION }}"
          /v:"${{ steps.nbgv-version.outputs.nuget_version }}"
          /d:sonar.token="$SONAR_TOKEN"
          /d:sonar.host.url="https://sonarcloud.io"
          /d:sonar.projectBaseDir="${{ github.workspace }}"
          /d:sonar.cs.opencover.reportsPaths="**/CoverageResults/coverage.opencover.xml"
          /d:sonar.exclusions="**/tests/**,**/*.Tests/**,**/*.IntegrationTests/**,**/*.IntegrationTesting/**,**/Migrations/**,**/*.ps1,**/docs/**,**/DocumentationSite/**,**/*.md,**/.github/**,**/*.yml,**/*.yaml"
          /d:sonar.coverage.exclusions="**/tests/**,**/*.Tests/**,**/*.IntegrationTests/**,**/*.IntegrationTesting/**,**/samples/**,**/*.ps1"
        # continue-on-error justified (#82): this workflow's purpose is publishing to NuGet.org,
        # and a Sonar token, quota or outage problem must not strand a release. Note the
        # consequence, which differs from the CI workflow: because the publish step's default
        # success() condition is still met, packages ship even when no analysis ran. That is
        # deliberate — gating a release on SonarCloud availability would let an outage block
        # shipping — but it does mean the warning step below is the only signal that a published
        # release went unanalysed.
        continue-on-error: true

      # Surfaces a skipped analysis as a warning annotation on the run. Without this the job is
      # green and indistinguishable from one where SonarCloud actually ran (#82).
      - name: Warn if SonarCloud analysis did not run
        # Not always(): that fires on a cancelled run too, emitting a spurious warning for a
        # job the user stopped deliberately. !cancelled() means "regardless of earlier failures,
        # but honour cancellation". Written as an expression because a bare leading '!' is a YAML
        # tag indicator and fails to parse.
        if: ${{ !cancelled() && steps.sonar-begin.outcome != 'success' }}
        run: |
          echo "::warning title=SonarCloud analysis skipped::SonarScanner Begin did not succeed (outcome: ${{ steps.sonar-begin.outcome }}), so no analysis was submitted for this run. Check the SonarScanner Begin step's log, and the steps before it — Begin reports 'skipped' when an earlier step failed."

      # Build and Test (always runs regardless of SonarCloud status).
      # Release configuration is mandatory here so that what is tested matches what is packed.
      # The packages published at the end of this workflow come from the dedicated pack step below,
      # not from this build - see the comment there.
      - name: Build
        run: dotnet build ./Ploch.Data.slnx --no-restore -c Release
      - name: Test Coverage
        run: dotnet test ./Ploch.Data.slnx --verbosity normal --no-build -c Release --logger "trx;LogFileName=TestOutputResults.xml" /p:CollectCoverage=true /p:CoverletOutput=./CoverageResults/ "/p:CoverletOutputFormat=cobertura%2copencover"

      # SonarCloud end (runs even after test failures, only if begin succeeded).
      # Fails the job loudly if post-processing fails — silent failures here led
      # to ~3 weeks of unanalysed builds when sonar-project.properties broke End.
      - name: SonarScanner End
        if: always() && steps.sonar-begin.outcome == 'success'
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: dotnet sonarscanner end /d:sonar.token="$SONAR_TOKEN"

      - name: Upload Test Results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: test-results
          path: |
            **/TestResults/*.xml
            **/TestResults/*.trx
      - name: Upload Coverage Results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: code-coverage
          path: |
            **/CoverageResults/*.xml

      # Pack separately from the build above, with -p:UseProjectReferences=false.
      #
      # Build and test must use ProjectReferences: the Ploch.TestingSupport.XUnit3.* projects are not
      # published as packages, so the test projects always reference the sibling ploch-common checkout
      # by project. Mixing that with a Ploch.Common PackageReference is what broke `dotnet test -c
      # Release` in issue #95, which is why UseProjectReferences now defaults to true.
      #
      # Packages must NOT be produced that way. A ProjectReference-resolved pack writes the sibling
      # checkout's version (currently 4.0.x-prerelease) into the nuspec, and no Ploch.Common 4.x exists
      # on nuget.org - the published packages would be unrestorable. Packing with
      # -p:UseProjectReferences=false restores the central package versions from Directory.Packages.props
      # instead. Pinning the ploch-common clone to a released tag is tracked in issue #67.
      - name: Pack (package-resolved dependencies)
        run: dotnet pack ./Ploch.Data.slnx -c Release -p:UseProjectReferences=false -o ./artifacts/packages

      # Publish all NuGet packages to NuGet.org
      # Use --skip-duplicate to prevent errors if a package with the same version already exists.
      # If you retry a failed workflow, already published packages will be skipped without error.
      # Only the artifacts directory is published: the bin/ directories also hold nupkgs from the
      # Release build, and those carry ProjectReference-resolved dependency versions. The
      # Ploch.Data.* filter keeps the sibling ploch-common packages, which packing the solution also
      # produces via the unpublished Ploch.TestingSupport.XUnit3.* project references, out of the push.
      - name: Publish NuGet package
        env:
          # NUGET_API_KEY is the canonical secret name (issue #126). This workflow used to
          # read the near-identical NUGET_APIKEY while release.yml read NUGET_API_KEY, so
          # rotating the nuget.org key in one place left the other publishing with a stale
          # key - a 401 discovered at release time. Both workflows now read the same secret.
          NUGET_API_KEY: ${{ secrets.NUGET_API_KEY }}
        # Push only what the pack step above produced. A broad `find . -name '*.nupkg'` would
        # also pick up the bin/ nupkgs from the Release build, which carry
        # ProjectReference-resolved dependency versions, and the sibling ploch-common packages
        # produced via the unpublished Ploch.TestingSupport.XUnit3.* project references - the
        # unrestorable dependency graph issue #95 exists to prevent. The empty check keeps a
        # silent no-op from passing as a successful publish.
        run: |
          PKGS=$(find ./artifacts/packages -name 'Ploch.Data.*.nupkg')
          if [ -z "$PKGS" ]; then
            echo "::error::No Ploch.Data.* .nupkg files were produced by the pack step."
            exit 1
          fi
          echo "$PKGS" | while read -r pkg; do
            dotnet nuget push "$pkg" --source https://api.nuget.org/v3/index.json -k "$NUGET_API_KEY" --skip-duplicate
          done
