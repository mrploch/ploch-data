# This workflow will build a .NET project
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-net

name: Build
on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:
env:
  SONAR_PROJECT_KEY: ${{ vars.SONAR_PROJECT_KEY }}
  SONAR_ORGANIZATION: ${{ vars.SONAR_ORGANIZATION }}
jobs:
  build:

    runs-on: ubuntu-latest

    steps:
      - run: echo "The branch name is ${{ github.repository }}"
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          # NBGV needs the full history to compute commit height.
          fetch-depth: 0
          # Do not leave the job token in .git/config, where any later repository-controlled
          # command could read it. Nothing here pushes: the sibling repositories are cloned over
          # plain public HTTPS, and the Pages deploy takes its token as an explicit input.
          persist-credentials: false
      - name: Clone mrploch-development (shared build config)
        run: git clone --depth 1 https://github.com/mrploch/mrploch-development.git ../mrploch-development
      - name: Clone ploch-common (project references)
        run: git clone https://github.com/mrploch/ploch-common.git ../ploch-common

      - name: Start SqlServer
        run: docker run --name sqlserver -e 'ACCEPT_EULA=Y' -e 'MSSQL_SA_PASSWORD=P@ssw0rd' -p 1401:1433 -d mcr.microsoft.com/mssql/server

      - name: Wait for SQL Server container
        uses: jakejarvis/wait-action@919fc193e07906705e5b7a50f90ea9e74d20b2b0 # v0.1.1
        with:
          time: '5s'

      - uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00 # v4.7.1
        with:
          distribution: 'zulu'
          java-version: '17'
      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: |
            8.0.x
            10.0.x

      - name: Restore .NET tools
        run: dotnet tool restore

      # For PR builds, embed the PR number and branch name in the prerelease tag
      # so packages are clearly identifiable (e.g. 3.1.1-pr.42.fix-serialization)
      - name: Configure PR package version
        if: github.event_name == 'pull_request'
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          BRANCH_NAME: ${{ github.head_ref }}
        run: |
          # Sanitize branch name for NuGet SemVer2 prerelease identifiers [a-zA-Z0-9-]
          SANITIZED=$(echo "$BRANCH_NAME" | sed 's/[^a-zA-Z0-9-]/-/g' | sed 's/--*/-/g' | sed 's/^-//' | sed 's/-$//' | cut -c1-20 | sed 's/-$//')
          # Guard against empty or purely-numeric identifiers (invalid in SemVer2)
          if [ -z "$SANITIZED" ]; then
            SANITIZED="branch"
          fi
          if echo "$SANITIZED" | grep -Eq '^[0-9]+$'; then
            SANITIZED="b-${SANITIZED}"
          fi
          # Read current major.minor from NBGV
          CURRENT_VERSION=$(dotnet nbgv get-version --variable SimpleVersion)
          BASE=$(echo "$CURRENT_VERSION" | cut -d. -f1-2)
          # Override the prerelease tag to include PR number and branch name
          dotnet nbgv set-version "${BASE}-pr.${PR_NUMBER}.${SANITIZED}"
          # NBGV reads version.json from the committed git state, so we must
          # commit the change for it to take effect. This ephemeral commit is
          # never pushed — it only exists on the CI runner.
          git add version.json
          git -c user.name="ci" -c user.email="ci@ci" commit -m "ci: PR version" --no-verify
          COMPUTED=$(dotnet nbgv get-version --variable NuGetPackageVersion)
          echo "PR NuGet package version: $COMPUTED"

      - name: Install mono
        run: |
          sudo apt install -y ca-certificates gnupg curl
          KEYRING=/usr/share/keyrings/mono-official-archive-keyring.gpg
          KEY_FINGERPRINT=3FA7E0328081BFF6A14DA29AA6A19B38D3D831EF
          IMPORTED=0
          # Primary: download the key directly from the mono project's HTTPS
          # endpoint. This avoids GPG keyservers entirely, which have been
          # unreliable (keyserver.ubuntu.com / pgp.mit.edu unresponsive,
          # keys.openpgp.org strips UIDs).
          if curl -fsSL --max-time 30 https://download.mono-project.com/repo/xamarin.gpg -o /tmp/mono.gpg.raw; then
            # The file may be either ASCII-armored or binary; --dearmor
            # handles the armored case, and a binary keyring can be copied
            # as-is. Try dearmor first; if it fails, treat the file as binary.
            if sudo gpg --dearmor < /tmp/mono.gpg.raw > /tmp/mono.gpg.bin 2>/dev/null && [ -s /tmp/mono.gpg.bin ]; then
              sudo cp /tmp/mono.gpg.bin "$KEYRING"
            else
              sudo cp /tmp/mono.gpg.raw "$KEYRING"
            fi
            sudo chmod 644 "$KEYRING"
            if sudo gpg --homedir /tmp --no-default-keyring --keyring "$KEYRING" --list-keys "$KEY_FINGERPRINT" 2>/dev/null | grep -q '^uid'; then
              echo "Imported mono signing key directly from download.mono-project.com"
              IMPORTED=1
            fi
          fi
          # Fallback: keyserver loop (each capped at 30s so an unresponsive
          # server cannot hang the build).
          if [ "$IMPORTED" -ne 1 ]; then
            echo "Direct download failed or yielded no usable key; falling back to keyservers..."
            sudo rm -f "$KEYRING"
            for ks in hkp://keyserver.ubuntu.com:80 hkp://pgp.mit.edu; do
              sudo timeout 30 gpg --homedir /tmp --no-default-keyring --keyring "$KEYRING" --keyserver "$ks" --recv-keys "$KEY_FINGERPRINT" || true
              if sudo gpg --homedir /tmp --no-default-keyring --keyring "$KEYRING" --list-keys "$KEY_FINGERPRINT" 2>/dev/null | grep -q '^uid'; then
                echo "Imported mono signing key (with UID) from $ks"
                IMPORTED=1
                break
              fi
              echo "Keyserver $ks did not yield a usable key, trying next..."
            done
          fi
          if [ "$IMPORTED" -ne 1 ]; then
            echo "::error::Failed to import mono signing key from any source"
            exit 1
          fi
          echo "deb [signed-by=$KEYRING] https://download.mono-project.com/repo/ubuntu stable-focal main" | sudo tee /etc/apt/sources.list.d/mono-official-stable.list
          sudo apt update
          sudo apt install -y mono-devel
      # The repository's own NuGet.Config already declares a source named "github", so a
      # "does a github source exist?" guard is always satisfied and would skip supplying the
      # credentials, leaving restore to fail with 401 the moment a Ploch.* package actually has
      # to be downloaded from the feed. The credentials are therefore always written, and into
      # the *user-level* config: the repository config clears inherited package sources, but
      # packageSourceCredentials are matched by source name across configuration files, so
      # credentials stored there still apply to the repository's "github" source.
      #
      # No secret is written to disk. NuGet expands %GH_PACKAGES_TOKEN% at restore time, and
      # that variable is set only on the restore step below, so no later repository-controlled
      # step (build, test, SonarScanner, docfx) can resolve the token out of this file.
      - name: Add GitHub Packages Source
        run: |
          CONFIG="$HOME/.nuget/NuGet/NuGet.Config"
          mkdir -p "$(dirname "$CONFIG")"
          {
            echo '<?xml version="1.0" encoding="utf-8"?>'
            echo '<configuration>'
            echo '  <packageSourceCredentials>'
            echo '    <github>'
            echo '      <add key="Username" value="kploch" />'
            echo '      <add key="ClearTextPassword" value="%GH_PACKAGES_TOKEN%" />'
            echo '    </github>'
            echo '  </packageSourceCredentials>'
            echo '</configuration>'
          } > "$CONFIG"
          cat "$CONFIG"
      # Restore (UsePlochProjectReferences switches SampleApp from PackageReference to ProjectReference)
      - name: Restore dependencies
        env:
          GH_PACKAGES_TOKEN: ${{ secrets.GH_PACKAGES_TOKEN }}
        run: dotnet restore ./Ploch.Data.slnx -p:UsePlochProjectReferences=true

      # Capture the NBGV-computed package version so SonarScanner can pass it
      # as sonar.projectVersion. Without this, the "Previous version" new-code
      # definition has no version history to diff against and treats the
      # entire baseline as new code on every analysis. Mirrors the fix from
      # mrploch/ploch-common#222. See issue #92.
      - name: Get NBGV version for SonarCloud
        id: nbgv-version
        run: |
          NUGET_VERSION=$(dotnet nbgv get-version --variable NuGetPackageVersion)
          echo "nuget_version=$NUGET_VERSION" >> $GITHUB_OUTPUT
          echo "SonarCloud project version: $NUGET_VERSION"

      # SonarCloud setup (non-blocking)
      - name: Install SonarCloud Scanner
        run: dotnet tool install --global dotnet-sonarscanner
        # continue-on-error justified (#82): SonarCloud is deliberately non-blocking here, so a
        # transient NuGet outage installing the tool must not fail the build. A failure is not
        # silent — Begin then fails too, End is skipped by its outcome gate, and the "SonarCloud
        # analysis did not run" step below emits a warning annotation.
        continue-on-error: true
      # Note: analysis settings (coverage paths, exclusions) are passed inline
      # via /d: arguments. The .NET edition of the SonarScanner does not read
      # sonar-project.properties — that file would actively fail post-processing.
      - name: SonarScanner Begin
        id: sonar-begin
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: >
          dotnet sonarscanner begin
          /k:"${{ env.SONAR_PROJECT_KEY }}"
          /o:"${{ env.SONAR_ORGANIZATION }}"
          /v:"${{ steps.nbgv-version.outputs.nuget_version }}"
          /d:sonar.token="$SONAR_TOKEN"
          /d:sonar.host.url="https://sonarcloud.io"
          /d:sonar.projectBaseDir="${{ github.workspace }}"
          /d:sonar.cs.opencover.reportsPaths="**/CoverageResults/coverage.opencover.xml"
          /d:sonar.exclusions="**/tests/**,**/*.Tests/**,**/*.IntegrationTests/**,**/*.IntegrationTesting/**,**/Migrations/**,**/*.ps1,**/docs/**,**/DocumentationSite/**,**/*.md,**/.github/**,**/*.yml,**/*.yaml"
          /d:sonar.coverage.exclusions="**/tests/**,**/*.Tests/**,**/*.IntegrationTests/**,**/*.IntegrationTesting/**,**/samples/**,**/*.ps1"
        # continue-on-error justified (#82): keeps a Sonar token, quota or configuration problem
        # from blocking the build and tests, which are the job's primary purpose. The End step is
        # gated on this step's outcome, and the warning step below makes the skip visible rather
        # than silent — a silent Begin failure is what hid ~3 weeks of unanalysed builds.
        continue-on-error: true

      # Surfaces a skipped analysis as a warning annotation on the run. Without this the job is
      # green and indistinguishable from one where SonarCloud actually ran (#82).
      - name: Warn if SonarCloud analysis did not run
        # Not always(): that fires on a cancelled run too, emitting a spurious warning for a
        # job the user stopped deliberately. !cancelled() means "regardless of earlier failures,
        # but honour cancellation". Written as an expression because a bare leading '!' is a YAML
        # tag indicator and fails to parse.
        if: ${{ !cancelled() && steps.sonar-begin.outcome != 'success' }}
        run: |
          echo "::warning title=SonarCloud analysis skipped::SonarScanner Begin did not succeed (outcome: ${{ steps.sonar-begin.outcome }}), so no analysis was submitted for this run. Check the SonarScanner Begin step's log, and the steps before it — Begin reports 'skipped' when an earlier step failed."

      # Build and Test (always runs regardless of SonarCloud status)
      - name: Build
        run: dotnet build ./Ploch.Data.slnx --no-restore -p:UsePlochProjectReferences=true
      - name: Test Coverage
        run: dotnet test ./Ploch.Data.slnx --verbosity normal --no-build --logger "trx;LogFileName=TestOutputResults.xml" /p:CollectCoverage=true /p:CoverletOutput=./CoverageResults/ "/p:CoverletOutputFormat=cobertura%2copencover" -p:UsePlochProjectReferences=true

      # SonarCloud end (runs even after test failures, only if begin succeeded).
      # Fails the job loudly if post-processing fails — silent failures here led
      # to ~3 weeks of unanalysed builds when sonar-project.properties broke End.
      - name: SonarScanner End
        if: always() && steps.sonar-begin.outcome == 'success'
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: dotnet sonarscanner end /d:sonar.token="$SONAR_TOKEN"

      - name: Upload Test Results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: test-results
          path: |
            **/TestResults/*.xml
            **/TestResults/*.trx
      - name: Upload Coverage Results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: code-coverage
          path: |
            **/CoverageResults/*.xml

      # Smoke-test the documentation build so a docs break surfaces on the pull request.
      # Deployment itself lives in publish-docs.yml, which is the only workflow granted
      # `pages: write`. Non-blocking: a docs failure must not fail a build whose packages
      # are otherwise good, but the warning below keeps it from being invisible.
      - name: Build documentation (smoke test)
        id: docfx
        # Gated on success(): a failed main build cannot produce a working docs build
        # either - they compile the same code - so running it anyway would only add a
        # duplicate, confusing failure. The tools are already restored earlier in the job.
        if: success()
        continue-on-error: true
        # This step builds without --no-restore, so it restores and therefore needs the
        # feed credential resolved. Scoped to this step for the same reason as the restore.
        env:
          GH_PACKAGES_TOKEN: ${{ secrets.GH_PACKAGES_TOKEN }}
        run: |
          # docfx reads the compiled Release assemblies and their XML doc files (see
          # publish-docs.yml for why source-based extraction cannot work here). The main
          # build above is Debug, so Release output has to be produced for the docs.
          dotnet build ./Ploch.Data.slnx -c Release -p:UsePlochProjectReferences=true
          dotnet docfx DocumentationSite/docfx.json

      - name: Warn if the documentation build failed
        if: ${{ !cancelled() && steps.docfx.outcome == 'failure' }}
        run: |
          echo "::warning title=Documentation build failed::docfx could not build the documentation site. The build is green because this step is best-effort, but publish-docs.yml will fail on merge to main. Check the 'Build documentation (smoke test)' step's log."
      # Publish prerelease NuGet packages to GitHub Packages (main branch only)
      # Release packages are published to nuget.org via the release workflow
      - name: Publish NuGet packages to GitHub Packages
        if: success() && github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_PACKAGES_TOKEN: ${{ secrets.GH_PACKAGES_TOKEN }}
        run: |
          dotnet nuget push ./**/*.nupkg --source github --skip-duplicate -k "$GH_PACKAGES_TOKEN"
          dotnet nuget push ./**/*.snupkg --source github --skip-duplicate -k "$GH_PACKAGES_TOKEN" || true

      # Publish PR packages to GitHub Packages for testing/validation
      # PR packages include branch name in the prerelease tag (configured above)
      - name: Publish PR packages to GitHub Packages
        if: success() && github.event_name == 'pull_request'
        env:
          GH_PACKAGES_TOKEN: ${{ secrets.GH_PACKAGES_TOKEN }}
        run: |
          if [ -z "$GH_PACKAGES_TOKEN" ]; then
            echo "::warning::GH_PACKAGES_TOKEN not available, skipping PR package publish"
            exit 0
          fi
          dotnet nuget push ./**/*.nupkg --source github --skip-duplicate -k "$GH_PACKAGES_TOKEN"
          dotnet nuget push ./**/*.snupkg --source github --skip-duplicate -k "$GH_PACKAGES_TOKEN" || true
