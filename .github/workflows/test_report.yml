name: 'Test Report'
on:
  workflow_run:
    workflows: [ 'Build' ]                     # runs after CI workflow
    branches: '**'
    types:
      - completed

permissions:
  actions: read
  checks: write
  contents: read

jobs:
  report:
    runs-on: ubuntu-latest
    steps:
      - name: Test Report
        uses: phoenix-actions/test-reporting@7317eea6e13c47348dd0bb318669485157c518d6 # v16
        id: test-report
        with:
          artifact: test-results
          name: 'Test Results'
          path: '**/TestResults/TestOutputResults.xml'
          reporter: dotnet-trx
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Read output variables
        run: |
          echo "url is ${{ steps.test-report.outputs.runHtmlUrl }}"
