name: 'Test Report'
on:
  workflow_run:
    workflows: [ 'Build' ]                     # runs after CI workflow
    branches: '**'
    types:
      - completed

permissions:
  actions: read
  checks: write
  contents: read

jobs:
  report:
    runs-on: ubuntu-latest
    steps:
      - name: Test Report
        uses: phoenix-actions/test-reporting@f957cd93fc2d848d556fa0d03c57bc79127b6b5e # v15
        id: test-report
        with:
          artifact: test-results
          name: 'Test Results'
          path: '**/TestResults/TestOutputResults.xml'
          reporter: dotnet-trx
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Read output variables
        run: |
          echo "url is ${{ steps.test-report.outputs.runHtmlUrl }}"
