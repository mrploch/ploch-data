# To get started with Dependabot version updates, you'll need to specify which
# package ecosystems to update and where the package manifests are located.
# Please see the documentation for all configuration options:
# https://docs.github.com/github/administering-a-repository/configuration-options-for-dependency-updates

version: 2
updates:
  - package-ecosystem: "nuget" # See documentation for possible values
    directory: "/" # Location of package manifests
    schedule:
      interval: "weekly"

  # Workflow actions are pinned to full commit SHAs for supply-chain hardening, which
  # means they no longer follow a moving tag and would otherwise never be updated.
  # Dependabot understands the "# vX.Y.Z" comment beside each SHA and raises PRs that
  # bump both the SHA and the comment together.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
